# Revue du dimanche du Club Perlimpinpin (Club ouvert, lot 4) :
# scripts/revue-dimanche.js — tri des annotations de la semaine, révisions en
# lot (API Message Batches), Étapes 2 et 3 seulement si une note change, score
# recalculé par le code. RIEN n'est publié : Arno valide sur /test/revue en
# tapant « oui ».
#
# Déclenchement :
#   - automatique le dimanche à 6 h et 7 h UTC : le script ne travaille que
#     s'il est 8 h à Paris (heure d'été : 6 h UTC ; d'hiver : 7 h UTC) ;
#   - « Traiter maintenant » sur /test/revue (une seule fiche), ou à la main :
#     Actions → Revue du dimanche → Run workflow.
# GitHub ne lance les tâches planifiées que depuis la branche par défaut
# (main) : ce workflow ne tourne automatiquement qu'une fois fusionné.
#
# Aucun nom ni e-mail d'adhérent dans les journaux : seulement des comptes et
# des identifiants. Journal des créations : artefact logs/insertions.jsonl.
# Secrets (Settings → Secrets and variables → Actions) : DATABASE_URL,
# ANTHROPIC_API_KEY, MISTRAL_API_KEY.

name: Revue du dimanche
run-name: ${{ inputs.fiche && format('Revue fiche {0}', inputs.fiche) || 'Revue du dimanche' }}

on:
  schedule:
    - cron: "0 6 * * 0"
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      fiche:
        description: "Traiter maintenant : id de la fiche (/declarations/<id>). Vide = revue de la semaine."
        required: false
        type: string
      simulation:
        description: "Simulation : compter seulement, sans appel payant ni écriture"
        required: false
        type: boolean
        default: false

# Jamais deux revues en même temps (une urgence attend la revue hebdomadaire).
concurrency:
  group: revue-dimanche
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  revue:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      # Étape 3 relancée par lot elle aussi (moitié prix), voir scripts/lib/claude-lot.js
      CLAUDE_LOT: "1"
      CLAUDE_LOT_ATTENTE_MAX_MIN: "240"
      FICHE: ${{ inputs.fiche }}
      SIMULATION: ${{ inputs.simulation }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des modules
        run: npm ci

      - name: Vérifications
        run: |
          for s in DATABASE_URL ANTHROPIC_API_KEY MISTRAL_API_KEY; do
            if [ -z "${!s}" ]; then echo "✗ Secret manquant ($s, voir l'en-tête du workflow)."; exit 1; fi
          done
          if [ -n "$FICHE" ] && ! echo "$FICHE" | grep -Eq '^[1-9][0-9]{0,9}$'; then echo "✗ Identifiant de fiche invalide."; exit 1; fi

      - name: Revue
        run: |
          ARGS="--oui"
          if [ "$SIMULATION" = "true" ]; then ARGS="--simulation"; fi
          if [ -n "$FICHE" ]; then
            node scripts/revue-dimanche.js --fiche "$FICHE" $ARGS
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/revue-dimanche.js --hebdo --forcer $ARGS
          else
            node scripts/revue-dimanche.js --hebdo $ARGS
          fi

      - name: Journal des créations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revue-insertions-${{ github.run_id }}
          path: logs/*.jsonl
          if-no-files-found: ignore
          retention-days: 90
